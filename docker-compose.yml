# Server version (Hostinger VPS Docker Manager / any Linux server).
# Settings come from config.yaml baked into the image (edit it in the repo, then redeploy).
# Secrets come from environment variables set in Hostinger's Docker Manager (never commit .env).

x-common: &common
  build: .
  image: binance-vwap-bot:latest
  environment:
    BINANCE_API_KEY: ${BINANCE_API_KEY:-}
    BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
    LIVE_TRADING: ${LIVE_TRADING:-no}
  volumes:
    - botdata:/app/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *common
    container_name: binance-vwap-bot
    command: ["python", "bot.py"]
    restart: unless-stopped
    stop_grace_period: 30s

  dashboard:
    image: binance-vwap-bot:latest
    build: .
    container_name: binance-vwap-dashboard
    command: ["python", "dashboard.py"]
    # No API keys here: the dashboard can only read.
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8080"
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in Hostinger environment variables}
    volumes:
      - botdata:/app/data:ro
    ports:
      - "${DASHBOARD_PORT:-8765}:8080"   # open from anywhere: http://YOUR-SERVER-IP:8765 (password protected)
    restart: unless-stopped
    depends_on:
      - bot
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  botdata:
