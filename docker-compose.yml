services:
  bot:
    build: .
    image: binance-vwap-bot:latest
    container_name: binance-vwap-bot
    command: ["python", "bot.py"]
    environment:
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      LIVE_TRADING: ${LIVE_TRADING:-no}
    volumes:
      - botdata:/app/data
    restart: unless-stopped

  dashboard:
    image: binance-vwap-bot:latest
    container_name: binance-vwap-dashboard
    command: ["python", "dashboard.py"]
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - botdata:/app/data:ro
    ports:
      - "8765:8080"
    restart: unless-stopped
    depends_on:
      - bot

volumes:
  botdata:
