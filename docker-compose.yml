# Start:   docker compose up -d --build        (bot + dashboard at http://localhost:8765)
# Logs:    docker compose logs -f bot
# Stop:    docker compose down
# Backtest: docker compose run --rm backtest     (add options after it, see README)

x-common: &common
  build: .
  image: binance-vwap-bot:latest
  env_file:
    - path: .env
      required: false     # paper mode works without a .env file
  volumes:
    - ./config.yaml:/app/config.yaml:ro   # your settings (read-only)
    - ./data:/app/data                    # state.json, logs, trades.csv, backtest reports
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *common
    container_name: binance-vwap-bot
    command: ["python", "bot.py"]
    restart: unless-stopped
    stop_grace_period: 30s

  backtest:
    <<: *common
    profiles: ["tools"]   # not started by "docker compose up"; run it with "docker compose run --rm backtest"
    entrypoint: ["python", "backtest.py"]
    command: []
    restart: "no"

  dashboard:
    image: binance-vwap-bot:latest
    build: .
    container_name: binance-vwap-dashboard
    command: ["python", "dashboard.py"]
    # NO env_file here on purpose: the dashboard never gets your API keys.
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8080"                     # port INSIDE the container (don't change)
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}   # optional, taken from .env if you set it
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data:ro                  # read-only: the dashboard can't change anything
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8765}:8080"   # only this computer can open it (http://localhost:8765)
    restart: unless-stopped
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
