services:
  trading_bot:
    container_name: telegram_crypto_bot
    build: https://github.com/somily88/updeted.git#main
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always

  caddy:
    image: caddy:2-alpine
    # Two HTTPS sites: your Telegram bot (sobhitrader.tech) and the VWAP bot dashboard (bot.sobhitrader.tech)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/caddy/Caddyfile <<'CADDY'
        sobhitrader.tech {
          reverse_proxy trading_bot:8000
        }
        bot.sobhitrader.tech {
          reverse_proxy host.docker.internal:8765
        }
        CADDY
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - trading_bot

volumes:
  caddy_data:
  caddy_config:
